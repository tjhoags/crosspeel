<text x="30" y="82" font-size="27" font-weight="600" fill="#14201B">Not every match is worth the same.</text>
<text x="30" y="112" font-size="15" fill="#55635C">How often two UNRELATED endpoints - different registrable domains - already agree on a field by coincidence.</text>
<text x="30" y="134" font-size="15" fill="#55635C">426,352 field comparisons across 14,279 pairs. A shorter bar means agreement there is rarer, so it proves more.</text>
