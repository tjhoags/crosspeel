<text x="30" y="606" font-size="13.5" fill="#55635C">Two unrelated endpoints agree on <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#14201B">tls_profile</tspan> four times in five. Agreeing there is nearly free.</text>
<text x="30" y="628" font-size="13.5" fill="#55635C">They agree on <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#14201B">header_order</tspan> once in twenty-three, so that match is worth fourteen times as much - and method version 1 counts them the same.</text>
